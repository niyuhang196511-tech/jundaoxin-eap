# EAP HA 反向代理（配合 docker-compose.ha.yml 的 nginx 服务挂载）
# 目标：两实例 least_conn 分流；/health 直通；SSE（流式对话/A2A 流）不缓冲。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # upstream：容器网络内两实例（服务名可 DNS 解析）；least_conn 把新请求分给在途最少的实例
    upstream eap_api {
        least_conn;
        server eap-api-1:8300 max_fails=3 fail_timeout=10s;   # 连续失败自动摘除，fail_timeout 后重试
        server eap-api-2:8300 max_fails=3 fail_timeout=10s;
        keepalive 32;                                          # 上游长连接（配合 proxy_set_header Connection ""）
    }

    server {
        listen 80;

        # /health 直通：负载均衡器/编排健康探测专用，关访问日志降噪
        location = /health {
            proxy_pass http://eap_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # 其余全部路径（API/控制台资源/SSE）
        location / {
            proxy_pass http://eap_api;
            proxy_http_version 1.1;

            # 透传客户端信息（应用侧限流/审计按真实来源记录）
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";     # 启用 upstream keepalive

            # SSE 不缓冲：/v1/chat/completions 与 /a2a message/stream 逐 token 推送，
            # 缓冲会导致流式输出卡顿成批到达（X-Accel-Buffering 由应用按响应控制亦生效）
            proxy_buffering off;
            proxy_cache off;

            # SSE 长连接超时放宽（默认 60s 会掐断长时间流式响应）
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # 请求体上限：应用网关上限 10MB（EAP_GATEWAY_MAX_BODY_BYTES）+ 余量。
            # chunked 收口契约（M55-B）：应用网关对无 Content-Length 的 chunked 请求体不校验
            # （EAP_GATEWAY_CHUNKED_MODE=proxy 缺省），长度界定信任本反代——nginx 对 chunked
            # 请求体同样按 client_max_body_size 强制（超限 413），自建反代必须复制该行；
            # 无法前置收口的场景可改 EAP_GATEWAY_CHUNKED_MODE=reject，由应用网关 411 拒绝
            # （runbook §9.7）
            client_max_body_size 16m;
        }
    }
}
