# Promtail：采 Docker 容器日志（json-file）→ Loki
# relabel 提炼容器名/服务名/compose 项目作为 Loki 标签，便于按服务检索
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project"]   # 仅采 compose 管理的容器
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      # EAP 结构化日志为 JSON 行（observability/middleware）：解析后 level 作标签
      # （低基数正当），trace_id 走 structured_metadata（M54-C，见下）
      - json:
          expressions:
            level: level
            trace_id: trace_id
            event: event
      - labels:
          level:
      # M54-C：trace_id 从 labels stage 迁到 structured_metadata stage——
      # trace_id 每请求唯一，作标签会为每条 trace 建一个流，索引基数随流量线性
      # 增长（Loki anti-pattern：TSDB 索引撑爆/慢查询）。metadata 不进索引；
      # LogQL 行过滤语法不变，仍可 {job="docker"} | trace_id="abc123" 检索
      # （Loki 3.x 对 structured metadata 同样生效，需 loki-config 的
      # allow_structured_metadata: true 配合）。
      - structured_metadata:
          trace_id:
