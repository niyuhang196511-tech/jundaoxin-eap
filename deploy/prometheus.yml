# EAP Prometheus 主配置（M49-D · P2 #24 告警链路联调）。
#
# 背景：此前全仓库没有 Prometheus 主配置——deploy/prometheus-alerts.yml 的 10 条告警规则
# 从未被任何 Prometheus 加载，告警链路（规则评估 -> alertmanager -> receiver）无从谈起。
# 本文件即该缺口的主配置，由 deploy/observability/docker-compose.observability.yml 的
# prometheus 服务挂载使用。
#
# 挂载方式（与 compose prometheus 服务 volumes 一致，相对 deploy/observability/）：
#   ../prometheus.yml          -> /etc/prometheus/prometheus.yml
#   ../prometheus-alerts.yml   -> /etc/prometheus/rules/prometheus-alerts.yml
# 因此下方 rule_files 使用容器内绝对路径。若在宿主机/裸机直接跑 prometheus，请把
# rule_files 与 alerting 目标改成实际本地路径与 alertmanager 地址。
#
# 网络前提（跨 compose 项目，诚实说明）：
#   eap 服务只 expose 8300 于 compose 内网（deploy/docker-compose.prod.yml，不映射宿主端口），
#   因此抓取 eap 要求本 Prometheus 容器加入后端栈的 docker 网络。observability 栈以
#   external network 接入：默认 eap-prod_default（生产栈 name: eap-prod 的默认网络，
#   需先起生产栈）；开发栈（eap/docker-compose.yml）设 EAP_BACKEND_NETWORK=eap_default。
#   详见 runbook §9.5「告警链路联调」。

global:
  scrape_interval: 15s        # /metrics 为轻量文本导出；15s 粒度足以支撑规则里的 5m/15m 窗口
  scrape_timeout: 10s
  evaluation_interval: 15s    # 规则评估与采集同频
  external_labels:
    monitor: eap              # 多套监控并存时标识告警来源

rule_files:
  # 容器内路径（见文件头挂载说明）；10 条规则指标名与 eap/src/eap/observability/metrics.py
  # 实际导出对齐（eap_requests_total / eap_request_latency_seconds_bucket / eap_task_queue_depth 等）
  - /etc/prometheus/rules/prometheus-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        # 同一 observability compose 栈内的 alertmanager 服务（服务名在栈内网络可解析）
        - targets: ["alertmanager:9093"]

scrape_configs:
  # EAP 后端 /metrics。job 名必须为 eap——prometheus-alerts.yml 的
  # EapInstanceDown / EapAllInstancesDown 以 up{job="eap"} 计数。
  # targets 走服务名解析，前提是 external network 已接通（见文件头网络前提）；
  # 网络未接通时 target 显示 down，属预期，先按 runbook §9.5 排查。
  #
  # 诚实说明（副本数口径）：单机生产栈只有一个 eap 服务，sum(up{job="eap"})=1 < 2，
  # EapInstanceDown（双实例 HA 口径，见 runbook §8.2）将持续触发——单机部署可接受
  # 该「无冗余」提醒，或自行把规则阈值改为 ==0（规则文件不属本次改动范围）。
  # HA 双实例/k8s 形态：把第二实例地址追加进 targets（k8s 用 ServiceMonitor 对齐 job 名）。
  - job_name: eap
    metrics_path: /metrics
    static_configs:
      - targets: ["eap:8300"]
        labels:
          deployment: docker-compose

  # Prometheus 自监控：保证 up{job="prometheus"} 恒在，便于区分「监控栈挂了」与「目标挂了」
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
