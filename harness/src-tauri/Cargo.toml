[package]
name = "eap-harness"
version = "1.0.0"
description = "EAP Harness 桌面端：订阅云端 Agent/技能并本地执行的员工客户端（docs/18）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# M39-A 本地技能运行时：Ed25519 验签（对齐平台 skill_pkg）+ 附件 sha256 清单复核
ed25519-dalek = "2"
sha2 = "0.10"
# M43-C 自动更新（docs/18 §M40 后置项 / GA）：Tauri updater 插件（Rust 侧运行时注入 endpoint/pubkey）
tauri-plugin-updater = "2"
