name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eap
    services:
      # M49-C：Redis 服务（宿主 63790 = tests/test_tasks_redis.py 与
      # test_multireplica.py 的默认端口约定）——MCP/Redis 集成步骤与多副本
      # 限流/registry 广播路径在 CI 真跑而非静默回退
      redis:
        image: redis:7-alpine
        ports:
          - 63790:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        # --extra redis：api/security.py 限流滑窗惰性 import redis.asyncio
        # （无包时所有走限流的端点 500），且集成步骤的 test_tasks_redis 需要
        run: uv sync --frozen --extra redis --extra otel --extra docs --extra tokens
      - name: "Lint (ruff: F/E9 only)"
        run: uv run ruff check src/ tests/ --select F,E9
      - name: Migration dry-run (empty DB)
        run: |
          uv run python -c "
          import os, tempfile
          os.environ['EAP_DB_URL'] = 'sqlite:///' + tempfile.mkdtemp() + '/ci.db'
          from eap.db import init_db
          init_db()
          print('migration dry-run OK')
          "
      - name: Run tests
        run: uv run pytest -q --ignore=tests/test_mcp.py --ignore=tests/test_tasks_redis.py
      - name: MCP integration (live server)
        run: uv run pytest tests/test_mcp.py tests/test_tasks_redis.py -q
        env:
          EAP_HOST: "127.0.0.1"
      - name: OpenAPI contract export & drift check (M48-B)
        # 契约即文档：重新导出 docs/openapi.json 与入库版本 diff——接口/Schema 漂移未同步即红
        run: |
          uv run python ../scripts/export_openapi.py
          git diff --exit-code -- ../docs/openapi.json

  backend-postgres:
    # M49-C：PostgreSQL 实测（成熟度盘点 P2 #22）——主套件在真实 PG 16 上跑：
    # 迁移链全量执行（含 a1f2c3d4e5f6/a7c9e1f3b5d7 的 RLS 启用 DDL）、方言行为、
    # tests/test_rls_behavior.py 行级租户隔离行为实测（SQLite 下整文件 skip）。
    # 不放 redis service（保持精简）：test_tasks_redis 同 backend job 被 ignore，
    # 限流路径无 EAP_REDIS_URL 时进程内回退（仅需 redis 包在场）。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eap
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eap
          POSTGRES_PASSWORD: eap
          POSTGRES_DB: eap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eap -d eap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen --extra postgres --extra redis --extra otel --extra docs --extra tokens
      - name: Migration dry-run (empty PostgreSQL)
        # 独立空库 eap_migdry（对齐 backend job 的 sqlite 临时库语义）：
        # 全新库 upgrade head 全链 + RLS DDL 在真实 PG 上可执行
        env:
          EAP_DB_URL: postgresql+psycopg://eap:eap@localhost:5432/eap_migdry
        run: |
          uv run python -c "
          import psycopg
          with psycopg.connect('postgresql://eap:eap@localhost:5432/eap', autocommit=True) as c:
              c.execute('CREATE DATABASE eap_migdry')
          from eap.db import init_db
          init_db()
          print('migration dry-run (postgres) OK')
          "
      - name: Run tests on PostgreSQL
        # M51-A 诊断增强：该步骤曾在 CI 红（65s 后 exit 1）而匿名侧拿不到日志
        # （logs 端点 403）；同款 PG16 在本地纯净克隆（HEAD 与 f1198f0 两棵树）
        # 均全量绿——ubuntu 侧差异本地无法穷尽。--tb=short 压缩 traceback 防刷屏，
        # --junitxml 落逐用例结果，失败时经下方工件二次诊断（无需日志权限）。
        run: uv run pytest -q --tb=short --junitxml=pg-results.xml --ignore=tests/test_mcp.py --ignore=tests/test_tasks_redis.py
        env:
          EAP_TEST_DB_URL: postgresql+psycopg://eap:eap@localhost:5432/eap
      - name: Upload pytest JUnit results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pg-pytest-results
          path: eap/pg-results.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eap/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: eap/frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync backend dependencies (E2E 后端运行环境)
        # M51-A：E2E 步骤要以 `uv run --no-sync python -m eap` 拉起后端——
        # 原 job 没有任何 Python/uv 环境，该命令必然失败（8300 无后端）。
        # extras 对齐 backend job（去掉 postgres：E2E 用临时 sqlite）。
        working-directory: eap
        run: uv sync --frozen --extra redis --extra otel --extra docs --extra tokens
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (vitest)
        run: pnpm test
      - name: E2E (Playwright)
        # M51-A 重写 + M51 二轮加固（一轮：CORS env 修复后仍整步骤撞 20min 超时——
        # annotations 实证 timeout 而非断言红）。三个嫌疑逐一处置：
        # ① playwright webServer 托管 `pnpm dev`：pnpm 对 next 子进程的 SIGTERM 转发
        #    不可靠，测试结束后回收阶段存在已知挂起风险 → CI 改自管 dev server
        #    （nohup + /login 探活），E2E_NO_WEB_SERVER 置真值 "1" 关闭 webServer 分支
        #    （该 env 的 truthy 语义首次真正生效；旧值 '' 为 falsy 歧义源已删）；
        # ② Next dev 按需编译：runner 冷启动每路由首访可达数十秒，逐用例撞 60s 超时
        #    → dev 就绪后 curl 预热全部在用路由，把冷编译移出用例时间预算；
        # ③ 无阶段可观测性 → 各阶段完成打 ::notice 注解（匿名 API 可读时间线），
        #    失败打 ::error:: 注解 + 上传前后端日志与 playwright 报告工件。
        # --reporter=line 紧凑输出；--max-failures=2 早止损。
        # 后端与 CORS/NEXT_PUBLIC_API_BASE_URL 语义同一轮（本地 git-ignored 的
        # eap/.env 与 frontend/.env.local 在 CI 均不存在，全部经步骤 env 显式注入）。
        timeout-minutes: 25
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8300
          # CORS 必配：缺省 cors_origins="" 不挂 CORS 中间件 → 浏览器 3001→8300 全拦（M51 一轮实测红因）
          EAP_CORS_ORIGINS: "http://localhost:3001,http://127.0.0.1:3001"
          EAP_DB_URL: sqlite:////tmp/eap-e2e.db
          E2E_NO_WEB_SERVER: "1"
        run: |
          pnpm exec playwright install --with-deps chromium
          echo "::notice::E2E phase 1/5 playwright+chromium installed"
          (cd .. && nohup uv run --no-sync python -m eap > /tmp/eap-backend.log 2>&1 &)
          backend_up=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8300/health > /dev/null; then backend_up=1; break; fi
            sleep 1
          done
          if [ "$backend_up" != "1" ]; then
            echo "::error::后端 8300 在 90s 内未就绪，日志尾部如下"
            tail -60 /tmp/eap-backend.log
            exit 1
          fi
          echo "::notice::E2E phase 2/5 backend ready after ~${i}s"
          (nohup pnpm dev -p 3001 > /tmp/eap-frontend.log 2>&1 &)
          frontend_up=0
          for i in $(seq 1 180); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:3001/login || true)
            if [ "$code" = "200" ]; then frontend_up=1; break; fi
            sleep 1
          done
          if [ "$frontend_up" != "1" ]; then
            echo "::error::前端 3001 /login 在 180s 内未就绪，日志尾部如下"
            tail -60 /tmp/eap-frontend.log
            exit 1
          fi
          echo "::notice::E2E phase 3/5 frontend dev ready after ~${i}s"
          for p in /agents /evals /gov /conn /models /tasks /audit /kb /assets /extensions /canvas; do
            curl -s -o /dev/null --max-time 120 "http://localhost:3001$p" || true
          done
          echo "::notice::E2E phase 4/5 routes pre-warmed"
          set +e
          pnpm exec playwright test --reporter=line --max-failures=2
          rc=$?
          set -e
          echo "::notice::E2E phase 5/5 playwright exit=${rc}"
          if [ $rc -ne 0 ]; then
            echo "::error::Playwright 失败（exit ${rc}）——后端日志尾部：$(tail -25 /tmp/eap-backend.log | tr -d '\r' | paste -sd '; ' -)"
            echo "::error::前端日志尾部：$(tail -25 /tmp/eap-frontend.log | tr -d '\r' | paste -sd '; ' -)"
            exit $rc
          fi
      - name: Upload E2E diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            eap/frontend/playwright-report/
            eap/frontend/test-results/
            /tmp/eap-backend.log
            /tmp/eap-frontend.log
          if-no-files-found: warn
          retention-days: 14
      - name: Build
        run: pnpm build

  dependency-scan:
    # M47-A：依赖漏洞扫描（成熟度盘点 P1）。后端 pip-audit（uv.lock 导出后审计锁文件），
    # 控制台 pnpm audit（仅 prod 依赖，high 级别即红）。失败即 job 红；
    # 不被任何 job needs 串联——与 backend/frontend 并行，不阻塞它们。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Export backend lockfile (uv.lock -> requirements-txt)
        run: |
          uv export --format requirements-txt --no-dev --no-hashes \
            --extra otel --extra docs --extra tokens -o requirements-audit.txt
        working-directory: eap
      - name: pip-audit (backend)
        # 锁文件已全量钉版（含传递依赖），--no-deps 只审计清单内包，避免二次解析
        run: uvx pip-audit -r requirements-audit.txt --no-deps
        working-directory: eap
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # M51-A：不配 cache:pnpm——本 job 只跑 `pnpm audit`（读 lockfile 即可），
          # 从不 pnpm install；setup-node 的 pnpm 缓存在 Post Run 阶段因 store 路径
          # 不存在而必失败（job 长期红在 Post Run actions/setup-node@v4）。
      - name: pnpm audit (console prod deps)
        run: pnpm audit --prod --audit-level=high
        working-directory: eap/frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: eap
          push: false
          tags: eap-backend:ci
      - name: Build console image (no push)
        uses: docker/build-push-action@v6
        with:
          context: eap/frontend
          push: false
          tags: eap-console:ci

  docs-check:
    # 文档/契约一致性检查（M32 · 任务组 P5 `ci-`）：
    # 链接/裸引用/mermaid/快照 commit 由 scripts/check_docs.py（纯标准库）负责；
    # workflow YAML 语法用 pyyaml 解析兜底（uv --with 临时依赖，不进项目依赖）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 快照头「代码 commit」需在完整历史中校验
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Validate workflow YAML syntax
        run: |
          uv run --no-project --with pyyaml python - <<'PY'
          import pathlib, yaml
          for p in sorted(pathlib.Path('.github/workflows').glob('*.y*ml')):
              yaml.safe_load(p.read_text(encoding='utf-8'))
              print(f'{p}: YAML OK')
          PY
      - name: Run docs/contract consistency check
        run: uv run --no-project python scripts/check_docs.py
