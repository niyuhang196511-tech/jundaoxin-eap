name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eap
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen --extra otel --extra docs --extra tokens
      - name: Lint (ruff: F/E9 only)
        run: uv run ruff check src/ tests/ --select F,E9
      - name: Migration dry-run (empty DB)
        run: |
          uv run python -c "
          import os, tempfile
          os.environ['EAP_DB_URL'] = 'sqlite:///' + tempfile.mkdtemp() + '/ci.db'
          from eap.db import init_db
          init_db()
          print('migration dry-run OK')
          "
      - name: Run tests
        run: uv run pytest -q
        env:
          EAP_HOST: "127.0.0.1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eap/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: eap/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (vitest)
        run: pnpm test
      - name: Build
        run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: eap
          push: false
          tags: eap-backend:ci
      - name: Build console image (no push)
        uses: docker/build-push-action@v6
        with:
          context: eap/frontend
          push: false
          tags: eap-console:ci
