name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eap
    services:
      # M49-C：Redis 服务（宿主 63790 = tests/test_tasks_redis.py 与
      # test_multireplica.py 的默认端口约定）——MCP/Redis 集成步骤与多副本
      # 限流/registry 广播路径在 CI 真跑而非静默回退
      redis:
        image: redis:7-alpine
        ports:
          - 63790:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        # --extra redis：api/security.py 限流滑窗惰性 import redis.asyncio
        # （无包时所有走限流的端点 500），且集成步骤的 test_tasks_redis 需要
        run: uv sync --frozen --extra redis --extra otel --extra docs --extra tokens
      - name: "Lint (ruff: F/E9 only)"
        run: uv run ruff check src/ tests/ --select F,E9
      - name: Migration dry-run (empty DB)
        run: |
          uv run python -c "
          import os, tempfile
          os.environ['EAP_DB_URL'] = 'sqlite:///' + tempfile.mkdtemp() + '/ci.db'
          from eap.db import init_db
          init_db()
          print('migration dry-run OK')
          "
      - name: Run tests
        run: uv run pytest -q --ignore=tests/test_mcp.py --ignore=tests/test_tasks_redis.py
      - name: MCP integration (live server)
        run: uv run pytest tests/test_mcp.py tests/test_tasks_redis.py -q
        env:
          EAP_HOST: "127.0.0.1"
      - name: OpenAPI contract export & drift check (M48-B)
        # 契约即文档：重新导出 docs/openapi.json 与入库版本 diff——接口/Schema 漂移未同步即红
        run: |
          uv run python ../scripts/export_openapi.py
          git diff --exit-code -- ../docs/openapi.json

  backend-postgres:
    # M49-C：PostgreSQL 实测（成熟度盘点 P2 #22）——主套件在真实 PG 16 上跑：
    # 迁移链全量执行（含 a1f2c3d4e5f6/a7c9e1f3b5d7 的 RLS 启用 DDL）、方言行为、
    # tests/test_rls_behavior.py 行级租户隔离行为实测（SQLite 下整文件 skip）。
    # 不放 redis service（保持精简）：test_tasks_redis 同 backend job 被 ignore，
    # 限流路径无 EAP_REDIS_URL 时进程内回退（仅需 redis 包在场）。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eap
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eap
          POSTGRES_PASSWORD: eap
          POSTGRES_DB: eap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eap -d eap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen --extra postgres --extra redis --extra otel --extra docs --extra tokens
      - name: Migration dry-run (empty PostgreSQL)
        # 独立空库 eap_migdry（对齐 backend job 的 sqlite 临时库语义）：
        # 全新库 upgrade head 全链 + RLS DDL 在真实 PG 上可执行
        env:
          EAP_DB_URL: postgresql+psycopg://eap:eap@localhost:5432/eap_migdry
        run: |
          uv run python -c "
          import psycopg
          with psycopg.connect('postgresql://eap:eap@localhost:5432/eap', autocommit=True) as c:
              c.execute('CREATE DATABASE eap_migdry')
          from eap.db import init_db
          init_db()
          print('migration dry-run (postgres) OK')
          "
      - name: Run tests on PostgreSQL
        run: uv run pytest -q --ignore=tests/test_mcp.py --ignore=tests/test_tasks_redis.py
        env:
          EAP_TEST_DB_URL: postgresql+psycopg://eap:eap@localhost:5432/eap

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eap/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: eap/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (vitest)
        run: pnpm test
      - name: E2E (Playwright)
        run: |
          pnpm exec playwright install chromium
          cd ../ && uv run --no-sync python -m eap > /tmp/eap.log 2>&1 &
          cd ../eap && sleep 8
          cd ../frontend
          npx playwright test
        env:
          E2E_NO_WEB_SERVER: ''
      - name: Build
        run: pnpm build

  dependency-scan:
    # M47-A：依赖漏洞扫描（成熟度盘点 P1）。后端 pip-audit（uv.lock 导出后审计锁文件），
    # 控制台 pnpm audit（仅 prod 依赖，high 级别即红）。失败即 job 红；
    # 不被任何 job needs 串联——与 backend/frontend 并行，不阻塞它们。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Export backend lockfile (uv.lock -> requirements-txt)
        run: |
          uv export --format requirements-txt --no-dev --no-hashes \
            --extra otel --extra docs --extra tokens -o requirements-audit.txt
        working-directory: eap
      - name: pip-audit (backend)
        # 锁文件已全量钉版（含传递依赖），--no-deps 只审计清单内包，避免二次解析
        run: uvx pip-audit -r requirements-audit.txt --no-deps
        working-directory: eap
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: eap/frontend/pnpm-lock.yaml
      - name: pnpm audit (console prod deps)
        run: pnpm audit --prod --audit-level=high
        working-directory: eap/frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: eap
          push: false
          tags: eap-backend:ci
      - name: Build console image (no push)
        uses: docker/build-push-action@v6
        with:
          context: eap/frontend
          push: false
          tags: eap-console:ci

  docs-check:
    # 文档/契约一致性检查（M32 · 任务组 P5 `ci-`）：
    # 链接/裸引用/mermaid/快照 commit 由 scripts/check_docs.py（纯标准库）负责；
    # workflow YAML 语法用 pyyaml 解析兜底（uv --with 临时依赖，不进项目依赖）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 快照头「代码 commit」需在完整历史中校验
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Validate workflow YAML syntax
        run: |
          uv run --no-project --with pyyaml python - <<'PY'
          import pathlib, yaml
          for p in sorted(pathlib.Path('.github/workflows').glob('*.y*ml')):
              yaml.safe_load(p.read_text(encoding='utf-8'))
              print(f'{p}: YAML OK')
          PY
      - name: Run docs/contract consistency check
        run: uv run --no-project python scripts/check_docs.py
