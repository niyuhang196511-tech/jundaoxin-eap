# EAP 单机部署：PostgreSQL + Redis + 平台（docs/09 §部署拓扑的单机版）
# 启动：cd eap && docker compose up -d --build
# 数据持久化：postgres-data 卷 + Redis AOF；平台无状态，多副本共享 Redis 任务队列
#
# 生产前检查清单：
#   1. 复制 .env.example 为 .env，更换 EAP_DEV_API_KEY / EAP_SESSION_SECRET
#   2. 配置 EAP_OPENAI_* 或在模型中心注册 vLLM/内网供应商
#   3. PostgreSQL口令（POSTGRES_PASSWORD）与 .env 的 EAP_DB_URL 同步修改
#   4. 回调类端点（/api/v1/im/*、/a2a）经反代暴露并加 TLS（docs/06 §1）

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eap
      POSTGRES_PASSWORD: eap        # * 生产必须更换
      POSTGRES_DB: eap
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eap -d eap"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "63790:6379"                 # 供宿主机跑 Redis 队列集成测试（63790 避开常见占用）；生产可去掉
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---- Milvus standalone（三路索引之向量路生产形态；EAP_MILVUS_URI 配置后启用）----
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd

  minio:
    image: quay.io/minio/minio:latest   # docker.io/minio/minio 在当前网络受限，用 quay 镜像源
    environment:
      MINIO_ACCESS_KEY: minioadmin   # * 生产必须更换
      MINIO_SECRET_KEY: minioadmin   # * 生产必须更换
    command: minio server /minio_data
    volumes:
      - minio-data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"                # 供宿主机跑向量路集成测试
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  eap:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EAP_DB_URL: postgresql+psycopg://eap:eap@postgres:5432/eap
      EAP_REDIS_URL: redis://redis:6379/0
      # CORS 白名单（逗号分隔）：控制台前端来源
      EAP_CORS_ORIGINS: "http://localhost:3000"
      # 容器内绑定全部网卡（M7 默认回环；容器必须显式放开，外层经端口映射/反代控制暴露面）
      EAP_HOST: 0.0.0.0
      # 以下变量可由同目录 .env 覆盖（docker compose 自动读取）：
      # EAP_DEV_API_KEY、EAP_SESSION_SECRET、EAP_SECRET_KEY（秘密加密，生产必配）、
      # EAP_OIDC_*、EAP_OPENAI_*、EAP_EMBEDDING_PROVIDER ...
    env_file:
      - path: .env
        required: false
    ports:
      - "8300:8300"
    restart: unless-stopped

  # 控制台前端（Next.js 独立部署，与后端分开扩缩容）
  frontend:
    build:
      context: ./frontend
      args:
        # 浏览器直接访问后端 API（NEXT_PUBLIC_* 构建期注入）
        # M6：默认不注入 token（用户经 /login 登录）；确需免登录嵌入场景再显式设置
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8300}
        NEXT_PUBLIC_EAP_TOKEN: ${NEXT_PUBLIC_EAP_TOKEN:-}
    depends_on:
      - eap
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
