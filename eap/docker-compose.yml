# EAP 单机部署：PostgreSQL + 平台（docs/09 §部署拓扑的单机版）
# 启动：cd eap && docker compose up -d --build
# 数据持久化：postgres-data 卷；平台无状态，副本横向扩容时换 Redis Streams 任务队列
#
# 生产前检查清单：
#   1. 复制 .env.example 为 .env，更换 EAP_DEV_API_KEY / EAP_SESSION_SECRET
#   2. 配置 EAP_OPENAI_* 或在模型中心注册 vLLM/内网供应商
#   3. PostgreSQL口令（POSTGRES_PASSWORD）与 .env 的 EAP_DB_URL 同步修改
#   4. 回调类端点（/api/v1/im/*、/a2a）经反代暴露并加 TLS（docs/06 §1）

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eap
      POSTGRES_PASSWORD: eap        # * 生产必须更换
      POSTGRES_DB: eap
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eap -d eap"]
      interval: 5s
      timeout: 3s
      retries: 12

  eap:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EAP_DB_URL: postgresql+psycopg://eap:eap@postgres:5432/eap
      # 以下变量可由同目录 .env 覆盖（docker compose 自动读取）：
      # EAP_DEV_API_KEY、EAP_SESSION_SECRET、EAP_OPENAI_*、EAP_EMBEDDING_PROVIDER ...
    env_file:
      - path: .env
        required: false
    ports:
      - "8300:8300"
    restart: unless-stopped

volumes:
  postgres-data:
