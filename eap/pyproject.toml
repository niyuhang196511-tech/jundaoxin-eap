[project]
name = "eap"
version = "0.3.0"
description = "EAP 企业级 Agent 智能体平台 — M1+M2+M3：模型中心 / 知识中心 / Agent Runtime / 发布治理 / 成本 / 策略 / 连接器 / 企业 IM / 技能包 / 评测（规则+LLM 裁判）/ Prompt 流水线与 A/B"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mcp>=2.2.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# 生产数据库驱动：EAP_DB_URL=postgresql+psycopg://... 时需要（docs/05 §5）
postgres = ["psycopg[binary]>=3.1"]
# 多副本任务队列：EAP_REDIS_URL 配置时需要（docs/03 §5 Redis Streams）
redis = ["redis>=5.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
