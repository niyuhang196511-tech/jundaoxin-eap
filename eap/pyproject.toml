[project]
name = "eap"
version = "0.9.0"
description = "EAP 企业级 Agent 智能体平台 — Agent Application / Governance / Extension Platform / 企业集成（事件-Webhook-IM-A2A-网关）/ 生产化（Worker 池-沙箱-HA-环境体系-CI/CD）/ 模型 / 知识 / Runtime / 发布治理 / 评测 / Prompt 流水线"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    "mcp>=2.2.0",
    "cryptography>=42.0",
    "alembic>=1.20.0",
    "numpy>=2.5.3",
    "croniter>=6.2.4",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
# 生产数据库驱动：EAP_DB_URL=postgresql+psycopg://... 时需要（docs/05 §5）
postgres = ["psycopg[binary]>=3.3.5"]
# 多副本任务队列：EAP_REDIS_URL 配置时需要（docs/03 §5 Redis Streams）
redis = ["redis>=8.1.0"]
# 向量路生产形态：EAP_MILVUS_URI 配置时需要（docs/04 §1 Milvus）
milvus = ["pymilvus>=3.0.1"]
# 可观测性：OTel tracing 导出（EAP_OTEL_ENDPOINT 配置时启用）
otel = [
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
]
# 文档解析（M12）：PDF/DOCX 摄入（未装时解析报提示性 ValueError）
docs = [
    "pypdf>=6.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]
# 精确 token 计量（M13）：tiktoken 缺失时回退 len//4 估算
tokens = ["tiktoken>=0.9"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# pytest fixture 跨模块复用：导入即注册，使用点在装饰器参数中（F811 误报场景）
"tests/test_jwt_auth.py" = ["F811"]
# 测试中的占位赋值
"tests/test_multiagent.py" = ["F841"]
